services:
  main-db:
    image: postgres:16
    container_name: main-db-container
    environment:
      POSTGRES_DB: commerce
      POSTGRES_USER: user
      POSTGRES_PASSWORD: secret123
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres-data:
