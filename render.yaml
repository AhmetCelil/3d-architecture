services:
  - type: web
    name: commerce-backend-staging
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: staging
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: AWS_ACCESS_KEY
        sync: false
      - key: AWS_SECRET_KEY
        sync: false
      - key: AWS_REGION
        value: eu-north-1
      - key: AWS_S3_BUCKET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_SENDER
        sync: false
      - key: RECAPTCHA_SECRET_KEY
        sync: false
      - key: STAGING_KEEP_ALIVE_API_KEY
        sync: false
