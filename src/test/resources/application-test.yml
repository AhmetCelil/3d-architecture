spring:
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5434/commerce_test}
    username: ${TEST_DB_USERNAME:test_user}
    password: ${TEST_DB_PASSWORD:test_secret}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
