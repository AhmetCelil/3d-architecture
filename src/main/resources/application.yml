server:
  port: 8080

spring:
  profiles:
    active: local # IDE'den çalıştırırken local varsayılan olsun

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.xml
