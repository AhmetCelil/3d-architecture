# Logging Configuration
logging:
  level:
    com.example.commerce.s3: DEBUG
    software.amazon.awssdk.request: DEBUG
    org.springframework.web.cors: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"