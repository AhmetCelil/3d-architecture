spring:
  config:
    activate:
      on-profile: local

  servlet:
    multipart:
      max-file-size: 1GB
      max-request-size: 1GB

  datasource:
    url: jdbc:postgresql://localhost:5432/commerce
    username: user
    password: secret123
    driver-class-name: org.postgresql.Driver

  # CORS Configuration
  web:
    cors:
      allowed-origins:
        - "http://localhost:3000"
        - "http://localhost:5173"
        - "http://localhost:8080"
      allowed-methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      allowed-headers: "*"
      allow-credentials: true

# Legacy MinIO Configuration (Artık kullanılmayacak)
minio:
  endpoint: http://localhost:9000
  accessKey: admin
  secretKey: admin123

