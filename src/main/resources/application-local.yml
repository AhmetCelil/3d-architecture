# application-local.yml
spring:
  servlet:
    jackson:
      deserialization:
        fail-on-unknown-properties: false
      mapper:
        accept-case-insensitive-enums: true


  # ===== DATABASE CONFIGURATION =====
  datasource:
    url: jdbc:postgresql://localhost:5432/commerce
    username: user
    password: secret123
    driver-class-name: org.postgresql.Driver

  # ===== JPA/HIBERNATE =====
  jpa:
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect


  # ===== CORS CONFIGURATION =====
  web:
    cors:
      allowed-origins:
        - "http://localhost:3000"
        - "http://localhost:5173"
        - "http://localhost:8080"
      allowed-methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      allowed-headers: "*"
      allow-credentials: true

# ===== SERVER CONFIGURATION =====
server:
  tomcat:
    max-http-form-post-size: 52428800  # 50MB
    max-parameter-count: 20000
    max-http-header-size: 8KB
    threads:
      max: 200
      min-spare: 10
  port: 8080

# ===== LOGGING =====
logging:
  level:
    org.apache.tomcat.util.http.fileupload: DEBUG
    org.springframework.web.multipart: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    com.example.commerce: DEBUG
    org.springframework.security: DEBUG

